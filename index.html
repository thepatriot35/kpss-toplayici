<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPSS & Kamu İlan Toplayıcı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 border-b border-slate-700 pb-6">
            <h1 class="text-3xl font-bold text-sky-400">KPSS & Kamu İlan Takip Portalı</h1>
            <p class="text-slate-400 mt-2">Otomatik taranan güncel kamu ve akademisyen alım ilanları</p>
        </header>

        <!-- Status & Filter -->
        <div class="flex justify-between items-center mb-6">
            <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
                Veriler yükleniyor...
            </div>
            <button onclick="loadData()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded transition">
                ↻ Yenile
            </button>
        </div>

        <!-- Content Area -->
        <div id="ilan-container" class="grid gap-4">
            <!-- İlanlar buraya dinamik yüklenecek -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bswaocmeujbbsnvwvpoq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzd2FvY21ldWpiYnNudnd2cG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzU3OTAsImV4cCI6MjEwNjk1MTc5MH0.50zNzY3xCDf0yfNaKbuYIxdjPKA2n7gH_5Zk-SR8Qq8";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            const container = document.getElementById('ilan-container');
            const statusBadge = document.getElementById('status-badge');
            
            container.innerHTML = '<div class="text-center py-12 text-slate-400">İlanlar Supabase\'den çekiliyor...</div>';

            try {
                // Tablo adını 'ilanlar' olarak sorguluyoruz
                const { data, error } = await _supabase
                    .from('ilanlar')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    statusBadge.innerText = "Veri Yok";
                    statusBadge.className = "text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
                    container.innerHTML = `
                        <div class="text-center py-12 border border-dashed border-slate-700 rounded-xl">
                            <p class="text-slate-400">Henüz veritabanında kayıtlı ilan bulunamadı.</p>
                            <p class="text-xs text-slate-500 mt-1">Robot ilanları tarayıp ekledikçe burada listelenecektir.</p>
                        </div>`;
                    return;
                }

                statusBadge.innerText = `${data.length} İlan Listelendi`;
                statusBadge.className = "text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";

                container.innerHTML = data.map(item => `
                    <div class="bg-cardbg border border-slate-700/60 hover:border-slate-500 transition p-5 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <h2 class="font-semibold text-lg text-slate-100 hover:text-sky-300 transition">
                                <a href="${item.link || '#'}" target="_blank" rel="noopener">${item.baslik || 'Başlıksız İlan'}</a>
                            </h2>
                            <div class="text-xs text-slate-400 flex items-center gap-3">
                                <span> Tarih: ${item.tarih || 'Belirtilmedi'}</span>
                                ${item.kurum ? `<span>• Kurum: ${item.kurum}</span>` : ''}
                            </div>
                        </div>
                        ${item.link ? `
                            <a href="${item.link}" target="_blank" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg transition font-medium whitespace-nowrap">
                                İlanı İncele →
                            </a>
                        ` : ''}
                    </div>
                `).join('');

            } catch (err) {
                console.error("Supabase Hata Detayı:", err);
                statusBadge.innerText = "Bağlantı Hatası";
                statusBadge.className = "text-xs px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
                
                container.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-sm">
                        <strong>Veriler çekilirken bir hata oluştu:</strong><br/>
                        ${err.message || JSON.stringify(err)}
                    </div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
